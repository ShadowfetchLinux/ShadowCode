# Copy to ~/.config/shadow-agent/config.yaml (or let `shadow config` create it).
# Never put API keys in this file. Name the environment variable instead.

model:
  default: mock
  provider: mock
  # Examples:
  #   grok:     provider openai_compatible, endpoint https://api.x.ai/v1, api_key_env XAI_API_KEY
  #   openai:   provider openai_compatible, endpoint https://api.openai.com/v1, api_key_env OPENAI_API_KEY
  #   ollama:   provider ollama, endpoint http://127.0.0.1:11434/v1
  #   llamacpp: provider llamacpp, endpoint http://127.0.0.1:8080/v1
  #   vllm:     provider vllm, endpoint http://127.0.0.1:8000/v1
  endpoint: ""
  api_key_env: OPENAI_API_KEY
  name: mock-coder
  context_limit: 128000

permissions:
  level: workspace          # read_only | workspace | elevated
  require_approval_for_dangerous: true
  network: false
  allow_root: false

git:
  auto_commit: false
  allow_destructive: false

logging:
  level: info

ui:
  host: 127.0.0.1
  port: 7430
  theme: light            # light | dark (desktop appearance)
  ability: none           # legacy capability preference; does not grant OS permissions
  notify: true            # desktop notify-send when a long task finishes
  notify_after_sec: 4.0   # only notify for jobs longer than this

agent:
  max_steps: 32
  tool_timeout_sec: 60
  parallel_reads: true
  model_retries: 3          # retry transient provider errors (429/5xx/connection)
  retry_backoff_sec: 1.0    # exponential backoff base

onboarding:
  completed: false
  workspace: ""

# Folders the UI may open without asking again. Managed by the trust dialog.
trusted_workspaces: []

routing:
  enabled: false
  planner: mock
  coder: mock
  reviewer: mock
  tester: mock

mcp:
  servers: []
