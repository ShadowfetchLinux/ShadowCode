name: Linux release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-build.txt -e '.[dev]'
      - name: Validate release tag
        run: .venv/bin/python -c 'import os; from shadow_agent import __version__; assert os.environ["GITHUB_REF_NAME"] == "v" + __version__'
      - name: Fetch pinned AppImage builder
        run: |
          curl --fail --location --output "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - run: APPIMAGETOOL="$RUNNER_TEMP/appimagetool" ./scripts/build-linux.sh
      - run: npm --prefix ui test
      - run: cd ui && npx playwright install --with-deps chromium && npm run test:e2e
      - name: Package Python distribution
        run: |
          .venv/bin/python -m build
          cd dist
          sha256sum *.AppImage *.tar.gz *.whl > SHA256SUMS
      - name: Smoke standalone runtime
        run: |
          dist/ShadowCode/shadowcode --version
          dist/ShadowCode-*-x86_64.AppImage --appimage-extract-and-run --version
          .venv/bin/python scripts/smoke-package.py "$PWD/dist/ShadowCode-0.19.0-x86_64.AppImage" --appimage-extract-and-run
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ShadowCode $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage dist/*.tar.gz dist/*.whl dist/SHA256SUMS --clobber
