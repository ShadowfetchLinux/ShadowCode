name: Native Linux release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Validate native release tag
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" = "$VERSION"
      - name: Native package dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Build and test the embedded interface
        run: npm --prefix ui ci && npm --prefix ui run build && npm --prefix ui test
      - name: Verify native source
        run: |
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 clippy --workspace --all-targets --locked -- -D warnings
          # qualification_real spawns target/debug/shadowcode; cargo test does not build it.
          cargo +1.95.0 build -p shadowcode-desktop --locked
          cargo +1.95.0 test --workspace --locked
      - name: Exercise native application behavior
        run: |
          node scripts/test-native-cli.mjs
          node scripts/test-native-stress.mjs
          node scripts/test-native-tui.mjs
          node scripts/test-native-mcp-server.mjs
          SHADOW_MCP_TRANSPORT=http node scripts/test-native-mcp-server.mjs
      - name: Exercise the native desktop window
        run: |
          cargo +1.95.0 install tauri-driver --version 2.0.6 --locked
          xvfb-run -a -s '-screen 0 1440x1100x24' dbus-run-session -- node scripts/test-native-desktop.mjs
      - name: Build and inspect release packages
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          node --test scripts/test-native-packaging-env.mjs
          node scripts/build-native.mjs
          node scripts/check-native-package.mjs "target/release/bundle/appimage/ShadowCode_${VERSION}_amd64.AppImage" "target/release/bundle/deb/ShadowCode_${VERSION}_amd64.deb"
          node scripts/test-native-runtime-sources.mjs
          node scripts/test-native-runtime.mjs
      - name: Exercise the packaged application
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BINARY="$GITHUB_WORKSPACE/target/release/bundle/appimage/ShadowCode_${VERSION}_amd64.AppImage"
          SHADOW_DESKTOP_BINARY="$BINARY" SHADOW_CLI_ARGS='["--appimage-extract-and-run"]' node scripts/test-native-cli.mjs
          SHADOW_DESKTOP_BINARY="$BINARY" SHADOW_CLI_ARGS='["--appimage-extract-and-run"]' node scripts/test-native-tui.mjs
          SHADOW_DESKTOP_BINARY="$BINARY" SHADOW_DESKTOP_ARGS='["--appimage-extract-and-run","ui"]' SHADOW_NATIVE_DEFAULT_PROFILE=1 xvfb-run -a -s '-screen 0 1440x1100x24' dbus-run-session -- node scripts/test-native-desktop.mjs
          SHADOW_DESKTOP_BINARY="$BINARY" SHADOW_CLI_ARGS='["--appimage-extract-and-run"]' SHADOW_MCP_TRANSPORT=http node scripts/test-native-mcp-server.mjs
          npm --prefix scripts/native-mcp-peer ci --ignore-scripts --no-audit --no-fund
          SHADOW_DESKTOP_BINARY="$BINARY" SHADOW_CLI_ARGS='["--appimage-extract-and-run"]' node scripts/test-native-mcp-peer.mjs
      - name: Create release checksums
        run: |
          cd target/release/bundle
          sha256sum appimage/*.AppImage appimage/*runtime-sources.tar.gz deb/*.deb > SHA256SUMS
      - name: Verify installer replacement and checksum refusal
        run: bash scripts/test-install-appimage.sh
      - name: Publish checked native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "ShadowCode $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/appimage/*.AppImage target/release/bundle/appimage/*runtime-sources.tar.gz target/release/bundle/deb/*.deb target/release/bundle/SHA256SUMS --clobber
