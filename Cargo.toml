[workspace]
members = ["native/core", "src-tauri"]
default-members = ["native/core"]
resolver = "2"

[workspace.package]
version = "0.22.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ShadowfetchLinux/ShadowCode"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
