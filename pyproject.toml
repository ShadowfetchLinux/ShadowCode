[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-agent"
version = "0.25.0"
description = "Linux-native, model-agnostic coding-agent harness (Claude Code / Codex alternative)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "ShadowCode", email = "209457103+ShadowfetchLinux@users.noreply.github.com" }]
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
shadow = "shadow_agent.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
