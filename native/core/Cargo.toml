[package]
name = "shadowcode-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shadowcode-engine"
path = "src/bin/shadowcode.rs"
test = false
bench = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "backup", "cache", "hooks", "limits", "fallible_uint"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
tempfile = "3"
regex = "1"
ignore = "0.4"
fs2 = "0.4"
libc = "0.2"
tracing = "0.1"
cap-std = "3"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "transport-streamable-http-client", "transport-streamable-http-server"] }
sse-stream = "=0.2.6"
bytes = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
# Level-triggered terminal polling preserves input readiness across resize events.
crossterm = { version = "=0.29.0", default-features = false, features = ["event-stream", "bracketed-paste", "use-dev-tty"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
toml = "=0.9.12"
